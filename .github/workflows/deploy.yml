name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Every test suite must pass before anything is deployed.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # Settings come from this repo's "production" environment (Settings → Environments).
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ""

      - name: Package deploy artifact
        run: |
          mkdir -p /tmp/artifact/backend /tmp/artifact/frontend
          cp -r backend/dist /tmp/artifact/backend/
          cp -r frontend/dist /tmp/artifact/frontend/
          tar czf /tmp/pravnyaadmin-deploy.tar.gz -C /tmp/artifact .

      # The server's backend/.env is written from the production environment on every deploy
      # (~/apps/install-env.sh refuses missing required values and keeps a backup). To change a key
      # or setting, change it in GitHub and re-run this workflow. See deploy/README.md.
      - name: Build the settings file
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
          BCRYPT_SALT_ROUNDS: ${{ vars.BCRYPT_SALT_ROUNDS }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          RETAIL_TENANT_ID: ${{ vars.RETAIL_TENANT_ID }}
          STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          umask 077
          for k in NODE_ENV PORT JWT_EXPIRES_IN BCRYPT_SALT_ROUNDS CORS_ORIGIN EMAIL_PROVIDER EMAIL_FROM_ADDRESS EMAIL_FROM_NAME APP_BASE_URL \
                   SMTP_HOST SMTP_PORT SMTP_SECURE RETAIL_TENANT_ID DATABASE_URL JWT_SECRET SMTP_USER SMTP_PASS ANTHROPIC_API_KEY GEMINI_API_KEY \
                   STORAGE_DRIVER S3_ENDPOINT S3_REGION S3_BUCKET S3_FORCE_PATH_STYLE S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY; do
            if [ -n "${!k}" ]; then printf '%s=%s\n' "$k" "${!k}"; fi
          done | sort > /tmp/pravnyaadmin.env
          echo "Settings: $(cut -d= -f1 /tmp/pravnyaadmin.env | tr '\n' ' ')"

      - name: Upload artifact and run deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy_key /tmp/pravnyaadmin-deploy.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/pravnyaadmin-deploy.tar.gz"
          scp -i ~/.ssh/deploy_key /tmp/pravnyaadmin.env "$DEPLOY_USER@$DEPLOY_HOST:/tmp/pravnyaadmin.env"
          rm -f /tmp/pravnyaadmin.env
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash /home/pravnix/apps/deploy-pravnyaadmin.sh"
