## Vhost for aac.pravnya.com -- the standalone "Pravnya Talk" PWA. Serves the same dist/ as
## app.pravnya.com but uses aac.html as the default document, and keeps CORS/referrer the same.
##
## Deploy steps (run on the server, as the user with nginx write permission):
##   sudo cp parent-app/deploy/aac-pravnya-nginx.conf /etc/nginx/sites-available/aac.pravnya.com.conf
##   sudo ln -sf /etc/nginx/sites-available/aac.pravnya.com.conf /etc/nginx/sites-enabled/
##   sudo certbot --nginx -d aac.pravnya.com      # issues the TLS cert
##   sudo nginx -t && sudo systemctl reload nginx
##
## DNS: an A record aac.pravnya.com -> the same IP as app.pravnya.com (via Cloudflare, proxied).

server {
    server_name aac.pravnya.com;

    include snippets/cloudflare-only.conf;

    # Same build directory as app.pravnya.com. aac.html is the entry.
    root /var/www/app2-pravnya;
    index aac.html;

    # Static assets with aggressive cache -- filenames are content-hashed by Vite.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker + manifests: no cache so updates roll out on next load.
    location = /sw.js { add_header Cache-Control "no-store"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-store"; try_files $uri =404; }
    location = /manifest-aac.webmanifest { add_header Cache-Control "no-store"; try_files $uri =404; }

    # API lives on app.pravnya.com; the PWA's fetches go to that host directly (CORS allowed there).
    # Everything else falls back to the AAC shell so the client-side routes work.
    location / {
        try_files $uri $uri/ /aac.html;
    }

    # Allow fullscreen + screen wake-lock (defaults are fine, but be explicit for future audits).
    add_header Permissions-Policy "fullscreen=(self), screen-wake-lock=(self)";
    add_header Referrer-Policy "no-referrer";

    listen 80;
    listen [::]:80;
    # certbot --nginx adds listen 443 ssl here, plus ssl_certificate lines.
}
